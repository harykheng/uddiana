<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Scan Opname - StokManager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #060d18; }
    .scan-page { min-height: 100vh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }

    /* Top bar */
    .scan-topbar {
      padding: 14px 16px 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .scan-topbar h1 { font-size: 16px; font-weight: 700; color: #fff; margin: 0; }
    .scan-topbar a { color: #5eead4; font-size: 13px; text-decoration: none; font-weight: 600; }

    /* Session badge */
    .session-badge {
      margin: 0 16px 12px;
      padding: 8px 14px; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .session-badge.active  { background: #042f2e; color: #2dd4bf; }
    .session-badge.none    { background: #450a0a; color: #fca5a5; }
    .session-badge .dot    { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* Scanner area */
    .scanner-wrap {
      margin: 0 16px 12px;
      border-radius: 14px; overflow: hidden;
      background: #0b1829; position: relative;
    }
    #reader { width: 100% !important; min-height: 240px; }
    #reader video { border-radius: 14px; width: 100% !important; }
    #reader img { display: none !important; }
    #reader > div { border: none !important; box-shadow: none !important; }
    .scanner-overlay {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    .scan-frame {
      width: 300px; height: 140px;
      border: 3px solid rgba(45,212,191,.9);
      border-radius: 10px; box-shadow: 0 0 0 999px rgba(0,0,0,.45);
    }
    .scan-line {
      position: absolute; width: 280px; height: 2px;
      background: linear-gradient(90deg, transparent, #2dd4bf, transparent);
      animation: scanline 2s linear infinite;
    }
    @keyframes scanline { 0%,100% { transform: translateY(-40px); opacity: 0; } 50% { transform: translateY(40px); opacity: 1; } }

    .scanner-hint {
      text-align: center; color: #64748b; font-size: 12px;
      margin: 0 16px 8px;
    }
    .search-wrap { margin: 0 16px 12px; position: relative; }
    .search-input {
      width: 100%; padding: 11px 14px; font-size: 14px;
      background: #0b1829; border: 1.5px solid #1a3352;
      border-radius: 10px; color: #f1f5f9; box-sizing: border-box;
    }
    .search-input::placeholder { color: #334155; }
    .search-input:focus { outline: none; border-color: #14b8a6; }
    .search-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #0b1829; border: 1.5px solid #1a3352; border-radius: 10px;
      z-index: 100; max-height: 240px; overflow-y: auto; display: none;
    }
    .search-dropdown.show { display: block; }
    .search-item {
      padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #060d18;
      transition: background .1s;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover, .search-item:active { background: #112240; }
    .search-item .si-name { font-size: 13px; font-weight: 600; color: #f1f5f9; }
    .search-item .si-meta { font-size: 11px; color: #64748b; margin-top: 2px; }

    /* Result card */
    .result-card {
      margin: 0 16px 12px;
      background: #0b1829; border-radius: 14px;
      padding: 16px; display: none;
      border: 1px solid #1a3352;
    }
    .result-card.show { display: block; }
    .result-card .prod-name { font-size: 15px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
    .result-card .prod-sku  { font-size: 12px; color: #64748b; margin-bottom: 14px; }
    .stock-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .stock-box {
      flex: 1; background: #060d18; border-radius: 8px;
      padding: 10px; text-align: center;
    }
    .stock-box .label { font-size: 10px; text-transform: uppercase; font-weight: 700; color: #64748b; margin-bottom: 4px; }
    .stock-box .value { font-size: 20px; font-weight: 800; color: #f1f5f9; }
    .stock-box.diff-pos .value { color: #2dd4bf; }
    .stock-box.diff-neg .value { color: #f87171; }
    .stock-box.diff-zero .value { color: #475569; }

    .input-group { margin-bottom: 14px; }
    .input-group label { font-size: 11px; font-weight: 700; color: #14b8a6; text-transform: uppercase; display: block; margin-bottom: 6px; letter-spacing: .05em; }
    .input-fisik-big {
      width: 100%; padding: 12px 16px; font-size: 24px; font-weight: 700;
      background: #060d18; border: 2px solid #1a3352; border-radius: 10px;
      color: #f1f5f9; text-align: center; box-sizing: border-box;
    }
    .input-fisik-big:focus { outline: none; border-color: #14b8a6; box-shadow: 0 0 0 3px rgba(20,184,166,.15); }

    .btn-submit {
      width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
      background: #0d9488; color: #fff; border: none; border-radius: 10px;
      cursor: pointer; transition: all .15s;
    }
    .btn-submit:hover:not(:disabled) { background: #0f766e; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

    .btn-scan-again {
      width: 100%; padding: 12px; font-size: 14px; font-weight: 600;
      background: transparent; color: #64748b; border: 1.5px solid #1a3352;
      border-radius: 10px; cursor: pointer; margin-top: 10px;
    }
    .btn-scan-again:hover { border-color: #14b8a6; color: #2dd4bf; }

    /* Done state */
    .done-card {
      margin: 0 16px 12px; background: #042f2e;
      border-radius: 14px; padding: 20px 16px; display: none; text-align: center;
      border: 1px solid #0d6b63;
    }
    .done-card.show { display: block; }
    .done-card .done-icon { font-size: 36px; margin-bottom: 10px; }
    .done-card .done-title { font-size: 16px; font-weight: 700; color: #2dd4bf; margin-bottom: 4px; }
    .done-card .done-sub { font-size: 12px; color: #5eead4; margin-bottom: 14px; }

    /* Not found */
    .notfound-card {
      margin: 0 16px 12px; background: #0b1829;
      border-radius: 14px; padding: 20px 16px; display: none; text-align: center;
      border: 1px solid #1a3352;
    }
    .notfound-card.show { display: block; }
    .notfound-card .nf-icon { font-size: 32px; margin-bottom: 8px; }
    .notfound-card .nf-title { font-size: 14px; font-weight: 700; color: #fca5a5; margin-bottom: 4px; }
    .notfound-card .nf-sub { font-size: 12px; color: #94a3b8; margin-bottom: 14px; }

    /* Recent scans */
    .recent-wrap { margin: 0 16px; flex: 1; }
    .recent-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #14b8a6; margin-bottom: 8px; letter-spacing: .05em; }
    .recent-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid #0b1829;
    }
    .recent-item .ri-name { flex: 1; font-size: 13px; color: #cbd5e1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent-item .ri-by   { font-size: 11px; color: #334155; }
    .recent-item .ri-diff { font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .ri-diff.pos { color: #2dd4bf; }
    .ri-diff.neg { color: #f87171; }
    .ri-diff.zero { color: #475569; }

    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }

    @media (min-width: 769px) {
      .scan-page { max-width: 860px; flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
      .scan-topbar, .session-badge, .scanner-wrap, .scanner-hint { width: 100%; }
      .desktop-main { flex: 1; min-width: 0; }
      .recent-wrap { width: 260px; flex-shrink: 0; margin: 0 0 0 16px; }
    }
  </style>
</head>
<body>
<div class="scan-page">

  <!-- Top bar -->
  <div class="scan-topbar">
    <h1>📋 Scan Opname</h1>
    <a href="index.html">✕ Keluar</a>
  </div>

  <!-- Session badge -->
  <div class="session-badge none" id="session-badge">
    <div class="dot"></div>
    <span id="session-label">Memeriksa sesi...</span>
  </div>

  <!-- Scanner -->
  <div class="scanner-wrap" id="scanner-wrap">
    <div id="reader"></div>
    <div class="scanner-overlay">
      <div class="scan-frame"></div>
      <div class="scan-line"></div>
    </div>
  </div>
  <div class="scanner-hint" id="scanner-hint">Arahkan kamera ke barcode produk</div>

  <div class="desktop-main">
  <!-- Manual search fallback -->
  <div class="search-wrap" id="search-wrap" style="display:none">
    <input type="text" class="search-input" id="search-input"
      placeholder="🔍 Cari nama produk atau SKU..."
      oninput="onSearchInput()" onkeydown="onSearchKeydown(event)" onblur="setTimeout(()=>closeDropdown(),200)" autocomplete="off">
    <div class="search-dropdown" id="search-dropdown"></div>
  </div>

  <!-- Done card -->
  <div class="done-card" id="done-card">
    <div class="done-icon">✅</div>
    <div class="done-title" id="done-title">Sudah Di-scan</div>
    <div class="done-sub" id="done-sub"></div>
    <button class="btn-submit" id="btn-koreksi" onclick="openCorrection()" style="display:none;margin-bottom:10px;background:#d97706">✏️ Koreksi Stok</button>
    <button class="btn-scan-again" onclick="resumeScanner()">🔄 Scan Produk Lain</button>
  </div>

  <!-- Not found card -->
  <div class="notfound-card" id="notfound-card">
    <div class="nf-icon">❓</div>
    <div class="nf-title">Produk Tidak Ditemukan</div>
    <div class="nf-sub" id="nf-sku"></div>
    <button class="btn-scan-again" onclick="resumeScanner()">🔄 Scan Ulang</button>
  </div>

  <!-- Result card -->
  <div class="result-card" id="result-card">
    <div class="prod-name" id="res-name"></div>
    <div class="prod-sku"  id="res-sku"></div>
    <div class="stock-row">
      <div class="stock-box">
        <div class="label">Stok Sistem</div>
        <div class="value" id="res-system">—</div>
      </div>
      <div class="stock-box" id="res-diff-box">
        <div class="label">Selisih</div>
        <div class="value" id="res-diff">—</div>
      </div>
    </div>
    <div class="input-group">
      <label>Stok Fisik (hasil hitung)</label>
      <input type="number" min="0" class="input-fisik-big" id="input-fisik"
        oninput="updateDiff()" onkeydown="onFisikKeydown(event)" placeholder="0">
    </div>
    <button class="btn-submit" id="btn-submit" onclick="submitScan()">✅ Simpan</button>
    <button class="btn-scan-again" onclick="resumeScanner()">↩ Batal, Scan Lagi</button>
  </div>

  </div><!-- /desktop-main -->

  <!-- Recent scans -->
  <div class="recent-wrap">
    <div class="recent-title">Scan Terakhir di Sesi Ini</div>
    <div id="recent-list"><div style="color:#475569;font-size:12px;padding:8px 0">Belum ada scan</div></div>
  </div>

  <div class="pb-safe"></div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
  let activeSession         = null;
  let currentUser           = null;
  let currentProduct        = null;
  let scanner               = null;
  let scanning              = true;
  let recentItems           = [];
  let allProducts           = [];
  let isCorrection          = false;
  let correctionSystemStock = 0;
  let prevPhysicalStock     = 0;

  async function init() {
    const auth = await requireSales();
    if (!auth) return;
    currentUser = auth;

    await checkActiveSession();
    if (activeSession) {
      const isMobile = window.matchMedia('(pointer: coarse)').matches;
      if (isMobile) {
        startScanner();
      } else {
        // Desktop: sembunyikan kamera, langsung pakai search bar
        document.getElementById('scanner-wrap').style.display = 'none';
        document.getElementById('scanner-hint').style.display = 'none';
      }
      loadRecentItems();
      loadAllProducts();
      document.getElementById('search-wrap').style.display = 'block';
      if (!isMobile) setTimeout(() => document.getElementById('search-input')?.focus(), 100);
    }
  }

  async function checkActiveSession() {
    const { data } = await supabase
      .from('opname_sessions')
      .select('id,name,created_by_name')
      .eq('status','active')
      .order('created_at', { ascending: false })
      .limit(1);

    const badge = document.getElementById('session-badge');
    const label = document.getElementById('session-label');

    if (data?.length) {
      activeSession = data[0];
      badge.className = 'session-badge active';
      label.textContent = `Sesi: ${activeSession.name}`;
      document.getElementById('scanner-wrap').style.display = 'block';
      document.getElementById('scanner-hint').style.display = 'block';
    } else {
      badge.className = 'session-badge none';
      label.textContent = 'Tidak ada sesi opname aktif';
      document.getElementById('scanner-wrap').style.display = 'none';
      document.getElementById('scanner-hint').style.display = 'none';
    }
  }

  function startScanner() {
    scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 300, height: 140 }, aspectRatio: 1.7 },
      onScanSuccess,
      () => {}
    ).catch(err => {
      document.getElementById('scanner-hint').textContent = 'Gagal akses kamera: ' + err;
    });
    scanning = true;
  }

  async function onScanSuccess(sku) {
    if (!scanning || !activeSession) return;
    scanning = false;
    document.getElementById('scanner-hint').textContent = 'Mencari produk...';
    hideAllCards();

    // 1. Cari produk by SKU
    const { data: prodList } = await supabase
      .from('products')
      .select('id,name,sku,stock_quantity,unit')
      .eq('sku', sku)
      .limit(1);

    if (!prodList?.length) {
      document.getElementById('nf-sku').textContent = `SKU: ${sku}`;
      document.getElementById('notfound-card').classList.add('show');
      return;
    }

    const prod = prodList[0];
    currentProduct = prod;

    // 2. Cek apakah sudah di-scan di sesi ini
    const { data: alreadyScanned } = await supabase
      .from('opname_items')
      .select('physical_stock,system_stock,scanned_by_name')
      .eq('session_id', activeSession.id)
      .eq('product_id', prod.id)
      .limit(1);

    if (alreadyScanned?.length) {
      const item = alreadyScanned[0];
      const diff = item.physical_stock - item.system_stock;
      prevPhysicalStock     = item.physical_stock;
      correctionSystemStock = item.system_stock;
      document.getElementById('done-title').textContent = prod.name;
      document.getElementById('done-sub').textContent =
        `Sudah di-scan oleh ${item.scanned_by_name || 'Unknown'} · Fisik: ${item.physical_stock} · Selisih: ${diff >= 0 ? '+' : ''}${diff}`;
      document.getElementById('btn-koreksi').style.display = '';
      document.getElementById('done-card').classList.add('show');
      return;
    }
    document.getElementById('btn-koreksi').style.display = 'none';

    // 3. Tampilkan form input
    document.getElementById('res-name').textContent   = prod.name;
    document.getElementById('res-sku').textContent    = `SKU: ${prod.sku}`;
    document.getElementById('res-system').textContent = prod.stock_quantity;
    document.getElementById('res-diff').textContent   = '—';
    document.getElementById('input-fisik').value      = '';
    document.getElementById('res-diff-box').className = 'stock-box';
    document.getElementById('result-card').classList.add('show');
    setTimeout(() => document.getElementById('input-fisik').focus(), 100);
  }

  function openCorrection() {
    isCorrection = true;
    hideAllCards();
    document.getElementById('res-name').textContent   = currentProduct.name;
    document.getElementById('res-sku').textContent    = `SKU: ${currentProduct.sku||'—'}`;
    document.getElementById('res-system').textContent = correctionSystemStock;
    document.getElementById('input-fisik').value      = prevPhysicalStock;
    document.getElementById('res-diff-box').className = 'stock-box';
    document.getElementById('result-card').classList.add('show');
    updateDiff();
    setTimeout(() => document.getElementById('input-fisik').focus(), 100);
  }

  function updateDiff() {
    const fisik = parseInt(document.getElementById('input-fisik').value);
    if (!currentProduct || isNaN(fisik)) {
      document.getElementById('res-diff').textContent = '—';
      document.getElementById('res-diff-box').className = 'stock-box';
      return;
    }
    const base = isCorrection ? correctionSystemStock : currentProduct.stock_quantity;
    const diff = fisik - base;
    const el   = document.getElementById('res-diff');
    const box  = document.getElementById('res-diff-box');
    el.textContent = diff >= 0 ? `+${diff}` : `${diff}`;
    box.className  = `stock-box ${diff > 0 ? 'diff-pos' : diff < 0 ? 'diff-neg' : 'diff-zero'}`;
  }

  async function submitScan() {
    const fisikVal = document.getElementById('input-fisik').value.trim();
    if (fisikVal === '' || isNaN(parseInt(fisikVal))) {
      showToast('Isi stok fisik terlebih dahulu', 'error');
      return;
    }

    const fisik     = parseInt(fisikVal);
    const baseStock = isCorrection ? correctionSystemStock : currentProduct.stock_quantity;
    const diff      = fisik - baseStock;
    const btn       = document.getElementById('btn-submit');
    setLoading(btn, true);

    const userName = currentUser?.profile?.name || currentUser?.session?.user?.email || 'Unknown';

    if (isCorrection) {
      // Mode koreksi: stok fisik yang diinput di sini adalah hasil hitung ulang —
      // jadikan itu langsung angka stok yang benar (bukan "stok terbaru + selisih lama").
      // Kalau tetap pakai freshStock+diff, dan ada 2 admin yang koreksi produk yang sama
      // nyaris bersamaan, selisih dari koreksi pertama bisa ketiban-terapkan dobel di atas
      // hasil koreksi kedua — angka stok akhir jadi salah walau kedua admin menghitung fisik
      // dengan benar. Set langsung ke `fisik` membuat hasil akhirnya selalu sama dengan
      // hitungan fisik yang terakhir disimpan, berapa kali pun koreksi ditumpuk.
      const { data: freshProd } = await supabase.from('products').select('stock_quantity').eq('id', currentProduct.id).single();
      const freshStock = freshProd ? freshProd.stock_quantity : correctionSystemStock;
      const newStock   = fisik;

      const { error: errProd } = await supabase
        .from('products')
        .update({ stock_quantity: newStock, last_opname_session_id: activeSession.id })
        .eq('id', currentProduct.id);

      if (errProd) { setLoading(btn, false); showToast('Gagal update stok: ' + errProd.message, 'error'); return; }

      await supabase.from('stock_movements').insert({
        product_id:      currentProduct.id,
        product_name:    currentProduct.name,
        type:            'adjustment',
        quantity:        Math.abs(newStock - freshStock),
        quantity_before: freshStock,
        quantity_after:  newStock,
        notes:           `Koreksi Opname: ${activeSession.name} (${diff >= 0 ? '+' : ''}${diff})`,
      });

      await supabase.from('opname_items')
        .update({ physical_stock: fisik, diff, scanned_by_id: currentUser?.session?.user?.id, scanned_by_name: userName })
        .eq('session_id', activeSession.id)
        .eq('product_id', currentProduct.id);

      isCorrection = false;
      currentProduct.stock_quantity = newStock;
    } else {
      // Insert dulu ke opname_items — constraint UNIQUE(session_id,product_id) di DB
      // yang jadi penjamin utama supaya produk yang sama tidak ke-scan dobel oleh 2 orang bersamaan.
      const { error: errInsert } = await supabase.from('opname_items').insert({
        session_id:      activeSession.id,
        product_id:      currentProduct.id,
        product_name:    currentProduct.name,
        system_stock:    baseStock,
        physical_stock:  fisik,
        diff:            diff,
        scanned_by_id:   currentUser?.session?.user?.id,
        scanned_by_name: userName,
      });

      if (errInsert) {
        setLoading(btn, false);
        if (errInsert.code === '23505') {
          // Sudah di-scan orang lain tepat sebelum insert ini — tampilkan siapa
          const { data: winner } = await supabase
            .from('opname_items').select('physical_stock,system_stock,scanned_by_name')
            .eq('session_id', activeSession.id).eq('product_id', currentProduct.id).limit(1);
          const w = winner?.[0];
          const wdiff = w ? (w.physical_stock - w.system_stock) : null;
          hideAllCards();
          document.getElementById('done-title').textContent = `✅ ${currentProduct.name}`;
          document.getElementById('done-sub').textContent = w
            ? `Baru saja di-scan oleh ${w.scanned_by_name || 'pengguna lain'} · Fisik: ${w.physical_stock} · Selisih: ${wdiff >= 0 ? '+' : ''}${wdiff}`
            : 'Baru saja di-scan oleh pengguna lain';
          document.getElementById('btn-koreksi').style.display = 'none';
          document.getElementById('done-card').classList.add('show');
        } else {
          showToast('Gagal simpan: ' + errInsert.message, 'error');
        }
        return;
      }

      // Ambil stok TERBARU (bukan cache saat scan) lalu terapkan diff di atasnya,
      // supaya tidak menimpa perubahan stok lain yang terjadi di jeda scan → submit.
      const { data: freshProd } = await supabase.from('products').select('stock_quantity').eq('id', currentProduct.id).single();
      const freshStock = freshProd ? freshProd.stock_quantity : baseStock;
      const newStock   = freshStock + diff;

      const { error: errProd } = await supabase
        .from('products')
        .update({ stock_quantity: newStock, last_opname_session_id: activeSession.id })
        .eq('id', currentProduct.id);

      if (errProd) { setLoading(btn, false); showToast('Gagal update stok: ' + errProd.message, 'error'); return; }

      await supabase.from('stock_movements').insert({
        product_id:      currentProduct.id,
        product_name:    currentProduct.name,
        type:            'adjustment',
        quantity:        Math.abs(diff),
        quantity_before: freshStock,
        quantity_after:  newStock,
        notes:           `Stock Opname: ${activeSession.name} (${diff >= 0 ? '+' : ''}${diff})`,
      });

      currentProduct.stock_quantity = newStock;
    }

    setLoading(btn, false);

    // Show done
    hideAllCards();
    document.getElementById('done-title').textContent = `✅ ${currentProduct.name}`;
    document.getElementById('done-sub').textContent   =
      `Stok fisik: ${fisik} · Selisih: ${diff >= 0 ? '+' : ''}${diff}`;
    document.getElementById('done-card').classList.add('show');

    // Refresh recent
    loadRecentItems();
    showToast('Tersimpan!', 'success');

    // Desktop: auto-focus search bar supaya langsung bisa scan berikutnya
    if (!window.matchMedia('(pointer: coarse)').matches) {
      setTimeout(() => document.getElementById('search-input')?.focus(), 150);
    }
  }

  function resumeScanner() {
    hideAllCards();
    currentProduct        = null;
    scanning              = true;
    isCorrection          = false;
    correctionSystemStock = 0;
    prevPhysicalStock     = 0;
    document.getElementById('btn-koreksi').style.display = 'none';
    document.getElementById('scanner-hint').textContent = 'Arahkan kamera ke barcode produk';
  }

  function hideAllCards() {
    ['result-card','done-card','notfound-card'].forEach(id => {
      document.getElementById(id).classList.remove('show');
    });
  }

  async function loadAllProducts() {
    let all = [], from = 0, CHUNK = 1000;
    while (true) {
      const { data } = await supabase.from('products').select('id,name,sku,stock_quantity,unit').order('name').range(from, from + CHUNK - 1);
      if (!data?.length) break;
      all = all.concat(data);
      if (data.length < CHUNK) break;
      from += CHUNK;
    }
    allProducts = all;
  }

  function onSearchInput() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    const dropdown = document.getElementById('search-dropdown');
    if (!q) { dropdown.classList.remove('show'); return; }

    const results = allProducts.filter(p =>
      p.name.toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q)
    ).slice(0, 8);

    if (!results.length) {
      dropdown.innerHTML = '<div class="search-item"><div class="si-name" style="color:#64748b">Produk tidak ditemukan</div></div>';
    } else {
      dropdown.innerHTML = results.map(p => `
        <div class="search-item" onmousedown="selectProduct('${p.id}')">
          <div class="si-name">${escapeHtml(p.name)}</div>
          <div class="si-meta">SKU: ${p.sku||'—'} · Stok: ${p.stock_quantity} ${p.unit||'pcs'}</div>
        </div>`).join('');
    }
    dropdown.classList.add('show');
  }

  function onFisikKeydown(e) {
    if (e.key !== 'Enter') return;
    if (window.matchMedia('(pointer: coarse)').matches) return; // skip di mobile
    e.preventDefault();
    submitScan();
  }

  function onSearchKeydown(e) {
    if (e.key !== 'Enter') return;
    if (window.matchMedia('(pointer: coarse)').matches) return; // skip di mobile/touch
    e.preventDefault();
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;
    // Exact SKU match — langsung select (untuk barcode scanner)
    const exact = allProducts.find(p => (p.sku||'').toLowerCase() === q.toLowerCase());
    if (exact) { selectProduct(exact.id); return; }
    // Fallback: kalau hasil filter cuma 1, langsung select juga
    const results = allProducts.filter(p =>
      p.name.toLowerCase().includes(q.toLowerCase()) || (p.sku||'').toLowerCase().includes(q.toLowerCase())
    );
    if (results.length === 1) selectProduct(results[0].id);
  }

  function closeDropdown() {
    document.getElementById('search-dropdown').classList.remove('show');
  }

  async function selectProduct(productId) {
    closeDropdown();
    document.getElementById('search-input').value = '';
    scanning = false;

    const prod = allProducts.find(p => p.id === productId);
    if (!prod) return;
    currentProduct = prod;
    hideAllCards();

    // Cek sudah di-scan di sesi ini
    const { data: alreadyScanned } = await supabase
      .from('opname_items')
      .select('physical_stock,system_stock,scanned_by_name')
      .eq('session_id', activeSession.id)
      .eq('product_id', prod.id)
      .limit(1);

    if (alreadyScanned?.length) {
      const item = alreadyScanned[0];
      const diff = item.physical_stock - item.system_stock;
      prevPhysicalStock     = item.physical_stock;
      correctionSystemStock = item.system_stock;
      document.getElementById('done-title').textContent = prod.name;
      document.getElementById('done-sub').textContent =
        `Sudah di-scan oleh ${item.scanned_by_name || 'Unknown'} · Fisik: ${item.physical_stock} · Selisih: ${diff >= 0 ? '+' : ''}${diff}`;
      document.getElementById('btn-koreksi').style.display = '';
      document.getElementById('done-card').classList.add('show');
      return;
    }
    document.getElementById('btn-koreksi').style.display = 'none';

    document.getElementById('res-name').textContent   = prod.name;
    document.getElementById('res-sku').textContent    = `SKU: ${prod.sku||'—'}`;
    document.getElementById('res-system').textContent = prod.stock_quantity;
    document.getElementById('res-diff').textContent   = '—';
    document.getElementById('input-fisik').value      = '';
    document.getElementById('res-diff-box').className = 'stock-box';
    document.getElementById('result-card').classList.add('show');
    setTimeout(() => document.getElementById('input-fisik').focus(), 100);
  }

  async function loadRecentItems() {
    const { data } = await supabase
      .from('opname_items')
      .select('product_name,physical_stock,system_stock,diff,scanned_by_name,scanned_at')
      .eq('session_id', activeSession.id)
      .order('scanned_at', { ascending: false })
      .limit(10);

    recentItems = data || [];
    const el = document.getElementById('recent-list');

    if (!recentItems.length) {
      el.innerHTML = '<div style="color:#475569;font-size:12px;padding:8px 0">Belum ada scan</div>';
      return;
    }

    el.innerHTML = recentItems.map(item => {
      const diff     = item.diff;
      const diffCls  = diff > 0 ? 'pos' : diff < 0 ? 'neg' : 'zero';
      const diffStr  = diff > 0 ? `+${diff}` : `${diff}`;
      const time     = new Date(item.scanned_at).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
      return `<div class="recent-item">
        <div>
          <div class="ri-name">${escapeHtml(item.product_name)}</div>
          <div class="ri-by">${escapeHtml(item.scanned_by_name||'?')} · ${time}</div>
        </div>
        <div class="ri-diff ${diffCls}">${diffStr}</div>
      </div>`;
    }).join('');
  }

  init();
</script>
</body>
</html>
