<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split CSV - StokManager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 16px; padding: 32px; max-width: 480px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    h1 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
    p  { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .drop-zone {
      border: 2px dashed #cbd5e1; border-radius: 10px;
      padding: 32px 20px; text-align: center; cursor: pointer;
      transition: all .15s; margin-bottom: 16px;
    }
    .drop-zone:hover, .drop-zone.over { border-color: #2563eb; background: #eff6ff; }
    .drop-zone .icon { font-size: 32px; margin-bottom: 8px; }
    .drop-zone .text { font-size: 13px; color: #64748b; }
    .drop-zone .filename { font-size: 13px; font-weight: 700; color: #2563eb; margin-top: 6px; }
    input[type=file] { display: none; }
    .row { display: flex; gap: 12px; margin-bottom: 16px; }
    .form-group { flex: 1; }
    input[type=number] {
      width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0;
      border-radius: 8px; font-size: 14px; outline: none;
    }
    input[type=number]:focus { border-color: #2563eb; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .result { margin-top: 20px; }
    .result-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: #f8fafc; border-radius: 8px;
      margin-bottom: 8px; font-size: 13px;
    }
    .result-item span { color: #64748b; }
    .btn-dl {
      padding: 5px 14px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; font-size: 12px;
      font-weight: 600; cursor: pointer;
    }
    .info-box {
      background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px;
      padding: 12px 14px; font-size: 12px; color: #166534; margin-top: 16px;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>✂️ Split CSV Produk</h1>
  <p>Upload file CSV produk, pilih jumlah baris per file, lalu download file-file yang sudah dipecah.</p>

  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()"
    ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
    <div class="icon">📄</div>
    <div class="text">Klik atau drag & drop file CSV di sini</div>
    <div class="filename" id="filename"></div>
  </div>
  <input type="file" id="file-input" accept=".csv" onchange="onFileSelect(this)">

  <div class="row">
    <div class="form-group">
      <label>Baris per file</label>
      <input type="number" id="chunk-size" value="200" min="50" max="500">
    </div>
    <div class="form-group">
      <label>Total baris</label>
      <input type="number" id="total-rows" value="0" readonly style="background:#f8fafc;color:#64748b;">
    </div>
  </div>

  <button class="btn btn-primary" id="btn-split" onclick="splitCSV()" disabled>✂️ Split & Download</button>

  <div class="result" id="result"></div>
</div>

<script>
  let csvContent = '';
  let headers = '';
  let dataRows = [];

  function onDragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('over'); }
  function onDragLeave()  { document.getElementById('drop-zone').classList.remove('over'); }
  function onDrop(e) {
    e.preventDefault();
    document.getElementById('drop-zone').classList.remove('over');
    const file = e.dataTransfer.files[0];
    if (file) readFile(file);
  }
  function onFileSelect(input) {
    if (input.files[0]) readFile(input.files[0]);
  }

  function readFile(file) {
    if (!file.name.endsWith('.csv')) { alert('Hanya file .csv yang didukung'); return; }
    document.getElementById('filename').textContent = file.name;
    const reader = new FileReader();
    reader.onload = e => {
      const text = e.target.result.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const lines = text.split('\n').filter(l => l.trim());
      if (lines.length < 2) { alert('File terlalu sedikit baris'); return; }
      headers  = lines[0];
      dataRows = lines.slice(1);
      document.getElementById('total-rows').value = dataRows.length;
      document.getElementById('btn-split').disabled = false;
      document.getElementById('result').innerHTML = '';
    };
    reader.readAsText(file, 'UTF-8');
  }

  function splitCSV() {
    const chunkSize = parseInt(document.getElementById('chunk-size').value) || 200;
    if (!dataRows.length) { alert('Upload file dulu'); return; }

    const chunks = [];
    for (let i = 0; i < dataRows.length; i += chunkSize) {
      chunks.push(dataRows.slice(i, i + chunkSize));
    }

    const resultEl = document.getElementById('result');
    resultEl.innerHTML = `<div class="info-box">✅ ${dataRows.length} baris dipecah menjadi <strong>${chunks.length} file</strong></div>`;

    chunks.forEach((chunk, idx) => {
      const content = headers + '\n' + chunk.join('\n');
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const from = idx * chunkSize + 1;
      const to   = Math.min((idx + 1) * chunkSize, dataRows.length);
      const filename = `produk_part${String(idx+1).padStart(2,'0')}_baris${from}-${to}.csv`;

      resultEl.innerHTML += `
        <div class="result-item">
          <span>📄 Part ${idx+1} &nbsp;(baris ${from}–${to}, ${chunk.length} produk)</span>
          <a href="${url}" download="${filename}">
            <button class="btn-dl">⬇️ Download</button>
          </a>
        </div>`;
    });
  }

  function onDragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('over'); }
  function onDragLeave()  { document.getElementById('drop-zone').classList.remove('over'); }
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
  }
</script>
</body>
</html>
